name: frontend
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter
  firebase_core: ^4.8.0
  cloud_firestore: ^6.4.0
  firebase_auth: ^6.5.0
  flutter_dotenv: ^6.0.1
  firebase_storage: ^13.4.0
  cupertino_icons: ^1.0.8
  get_it: ^9.2.1
  go_router: ^17.2.3
  provider: ^6.1.5+1
  google_fonts: ^8.1.0
  secure_application: ^4.1.0
  pdf: ^3.12.0
  printing: ^5.13.1
  screen_protector: ^1.5.1
  flutter_quill: ">=11.5.0 <13.0.0"
  flutter_quill_to_pdf: ^2.3.9
  http: ^1.3.0
  intl: ^0.20.2
  shared_preferences: ^2.5.5
  flutter_localizations:
    sdk: flutter
  cloud_functions: 6.3.2
  file_picker: ^11.0.2
  syncfusion_flutter_pdfviewer: ^33.2.12
  url_launcher: ^6.2.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  firebase_core_platform_interface: any

flutter:
  generate: true
  uses-material-design: true

  assets:
    - .env
    - assets/images/Shah2Range.jpeg
    - assets/images/levelup_mark.png
    - assets/images/levelup_logo_full.png
    - assets/fonts/
    
  fonts:
    - family: Cairo
      fonts:
        - asset: assets/fonts/static/Cairo-Regular.ttf
        - asset: assets/fonts/static/Cairo-Bold.ttf
        - asset: assets/fonts/static/Cairo-Light.ttf
        - asset: assets/fonts/static/Cairo-Medium.ttf
        - asset: assets/fonts/static/Cairo-SemiBold.ttf
        - asset: assets/fonts/static/Cairo-ExtraBold.ttf
        - asset: assets/fonts/static/Cairo-Black.ttf
        - asset: assets/fonts/static/Cairo-ExtraLight.ttf
          weight: 700